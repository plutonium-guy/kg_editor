[package]
name = "kg-mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP stdio server that exposes kg-server as Claude-callable tools."

[dependencies]
serde        = { workspace = true }
serde_json   = { workspace = true }
tokio        = { workspace = true, features = ["macros", "rt-multi-thread", "io-std", "io-util"] }
tracing      = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest      = { workspace = true }
anyhow       = { workspace = true }
# Official Anthropic/MCP Rust SDK (modelcontextprotocol/rust-sdk).
# "server"       – MCP server types + schemars-based JSON Schema generation.
# "macros"       – #[tool_router] / #[tool] / #[tool_handler] proc-macros.
# "transport-io" – stdio (stdin/stdout) transport for the server.
rmcp     = { version = "1.7", features = ["server", "macros", "transport-io"] }
schemars = "1.0"

[dev-dependencies]
axum    = { workspace = true }
hyper   = { workspace = true }
tokio   = { workspace = true, features = ["macros", "rt-multi-thread", "process", "io-util"] }
