[package]
name = "kg-core-wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "wasm-bindgen JS bindings for kg-core."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kg-core              = { path = "../kg-core" }
