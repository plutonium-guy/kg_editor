[workspace]
resolver = "2"
members  = ["crates/kg-core", "crates/kg-neo4j", "crates/kg-core-wasm", "crates/kg-server", "crates/kg-schema", "crates/kg-mcp", "examples"]
exclude  = ["examples/wasm_crud", "webui"]

[workspace.package]
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"
repository = "https://github.com/amiyamandal/kg_editor"

[workspace.dependencies]
chrono       = { version = "0.4", default-features = false, features = ["serde", "clock"] }
smallvec     = { version = "1.13", features = ["serde"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
thiserror    = "1"
tokio        = { version = "1", features = ["macros", "rt-multi-thread"] }
neo4rs       = "0.8"
base64       = "0.22"
insta        = { version = "1", features = ["json"] }
testcontainers = "0.20"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"
web-sys      = { version = "0.3", features = ["Request","RequestInit","RequestMode","Response","Window","Headers"] }
js-sys       = "0.3"
serde-wasm-bindgen = "0.6"
axum         = "0.7"
tower        = "0.5"
tower-http   = { version = "0.6", features = ["cors", "fs", "trace"] }
hyper        = "1"
tokio-tungstenite = "0.23"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest      = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_yaml   = "0.9"
anyhow       = "1"
