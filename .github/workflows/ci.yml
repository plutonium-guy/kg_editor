name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  go-fmt-vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - run: gofmt -l . | tee /tmp/fmt.out && test ! -s /tmp/fmt.out
      - run: go vet ./...

  go-test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - run: go test ./internal/schema/... ./internal/mcp/...

  go-test-integration:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5-community
        ports: ["7687:7687"]
        env: { NEO4J_AUTH: neo4j/testtest }
        options: >-
          --health-cmd="cypher-shell -u neo4j -p testtest 'RETURN 1' || exit 1"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_PASSWORD: testtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - run: go test -tags=integration ./internal/store/... ./internal/api/...

  webui-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd webui && npm ci
      - run: cd webui && npm test
      - run: cd webui && npm run build

  webui-e2e:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5-community
        ports: ["7687:7687"]
        env: { NEO4J_AUTH: neo4j/testtest }
        options: >-
          --health-cmd="cypher-shell -u neo4j -p testtest 'RETURN 1' || exit 1"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_PASSWORD: testtest
      KG_SCHEMA: ${{ github.workspace }}/kg-schema.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - run: cd webui && npm ci
      - run: cd webui && npx playwright install --with-deps chromium
      - run: go build -o bin/kg-server ./cmd/kg-server
      - run: nohup ./bin/kg-server > kg-server.log 2>&1 &
      - run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/health && break || sleep 2
          done
      - run: cd webui && npm run e2e
